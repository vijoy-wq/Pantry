<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Metro Pantry</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;800&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column, sticky header + category rail, bottom tabs.
   Look: cool neutral ground, indigo accent, status colours kept separate (out / low / ok). */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --ink:#161A2B; --ink2:#5B6178; --line:#E3E6F0;
  --accent:#4743DB; --accent-ink:#FFFFFF; --accent-soft:#E8E8FC;
  --out:#B3261E; --out-soft:#FCE9E8; --low:#8A4F00; --low-soft:#FFF0D2; --ok:#17703F; --ok-soft:#DFF4E8; --new:#5B6178; --new-soft:#ECEEF5;
  --tile-l:0.93; --tile-c:0.05; --tile-ink-l:0.38; --shadow:0 1px 2px rgba(20,24,50,.06),0 6px 18px rgba(20,24,50,.06);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1120; --surface:#181C2F; --ink:#EEF0FB; --ink2:#A4AAC4; --line:#2A3050;
  --accent:#9C9BFF; --accent-ink:#0E1120; --accent-soft:#25274F;
  --out:#FF8A93; --out-soft:#3B1B22; --low:#F6BC55; --low-soft:#35290F; --ok:#62D69C; --ok-soft:#10301F; --new:#A4AAC4; --new-soft:#232842;
  --tile-l:0.3; --tile-c:0.06; --tile-ink-l:0.88; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#181C2F; --ink:#EEF0FB; --ink2:#A4AAC4; --line:#2A3050;
  --accent:#9C9BFF; --accent-ink:#0E1120; --accent-soft:#25274F;
  --out:#FF8A93; --out-soft:#3B1B22; --low:#F6BC55; --low-soft:#35290F; --ok:#62D69C; --ok-soft:#10301F; --new:#A4AAC4; --new-soft:#232842;
  --tile-l:0.3; --tile-c:0.06; --tile-ink-l:0.88; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
.brand p{margin:0;color:var(--ink2);font-size:12.5px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink2);display:inline-block}
.sync.live i{background:var(--ok)}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px;margin-bottom:10px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;height:100%}
.search svg{flex:none;color:var(--ink2)}

/* category rail */
.rail{display:flex;gap:6px;overflow-x:auto;padding-block:2px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.cat{flex:none;width:68px;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:2px 0;scroll-snap-align:start}
.cat .tile{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;
  background:oklch(var(--tile-l) var(--tile-c) var(--h,260));color:oklch(var(--tile-ink-l) .1 var(--h,260));border:2px solid transparent}
.cat[aria-pressed="true"] .tile{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cat span.lb{font-size:11px;line-height:1.15;text-align:center;color:var(--ink2);font-weight:600;max-width:68px}
.cat[aria-pressed="true"] span.lb{color:var(--ink)}
.cat .bd{position:absolute;top:-3px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--out);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px;font-weight:800}
:root[data-theme="dark"] .cat .bd{color:#1a0b0e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cat .bd{color:#1a0b0e}}

/* home grid */
.home h2.gh{font-size:17px;font-weight:800;margin:22px 0 10px}
.home .gh small{font-size:12.5px;font-weight:700;color:var(--accent);float:right;background:none;border:0;padding:0}
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 10px}
.ctile{background:none;border:0;padding:0;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;min-width:0;color:var(--ink)}
.cimg{position:relative;width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;display:grid;place-items:center;background:oklch(var(--tile-l) var(--tile-c) var(--h,260));color:oklch(var(--tile-ink-l) .1 var(--h,260));font-weight:800;font-size:20px}
.cimg img{width:100%;height:100%;object-fit:cover;display:block}
.cimg.col{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;padding:3px}
.cimg.col img{border-radius:7px}
.cimg .bd{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--out);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px;font-weight:800}
.clb{font-size:12px;font-weight:600;line-height:1.2}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.mini{flex:none;width:124px;background:var(--surface);border-radius:14px;padding:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;text-align:left;border:0;color:var(--ink)}
.mini .ph{width:100%!important;height:84px!important;border-radius:10px}
.mini h3{font-size:12.5px;margin:0;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(528px,calc(100% - 24px));z-index:24;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(20,24,50,.28)}
.backrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 0}
.back{background:none;border:0;font-weight:800;color:var(--accent);padding:4px 0;font-size:14px}
.backrow .btn{font-size:12px;padding:6px 10px;color:var(--accent)}

/* filter chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding-block:8px 2px}
.tools .btn{font-size:12px;padding:7px 11px;color:var(--accent)}
.tools .btn.sure{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.chip b{font-weight:800}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.c-out[aria-pressed="true"]{background:var(--out);border-color:var(--out);color:#fff}
.chip.c-low[aria-pressed="true"]{background:var(--low);border-color:var(--low);color:#fff}
.chip.c-ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"].c-out,:root[data-theme="dark"] .chip[aria-pressed="true"].c-low,:root[data-theme="dark"] .chip[aria-pressed="true"].c-ok{color:#101322}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"].c-out,:root:not([data-theme="light"]) .chip[aria-pressed="true"].c-low,:root:not([data-theme="light"]) .chip[aria-pressed="true"].c-ok{color:#101322}}

/* list */
.sec-h{position:sticky;top:var(--stick,150px);z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:baseline;padding-block:14px 8px}
.sec-h h2{margin:0;font-size:15px;font-weight:800}
.sec-h span{font-size:12px;color:var(--ink2)}
.list{display:grid;gap:10px}
.card{display:grid;grid-template-columns:76px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.ph{width:76px;height:76px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:22px;overflow:hidden;
  background:oklch(var(--tile-l) var(--tile-c) var(--h,260));color:oklch(var(--tile-ink-l) .1 var(--h,260))}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cb{min-width:0;display:flex;flex-direction:column;gap:4px}
.nm{margin:0;font-size:14.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.mt{margin:0;color:var(--ink2);font-size:12px}
.cr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:800;border-radius:7px;padding:4px 8px;white-space:nowrap}
.s-out{background:var(--out-soft);color:var(--out)} .s-low{background:var(--low-soft);color:var(--low)}
.s-ok{background:var(--ok-soft);color:var(--ok)} .s-new{background:var(--new-soft);color:var(--new)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.step button{width:38px;height:36px;border:0;background:transparent;font-size:20px;font-weight:600;line-height:1;color:var(--accent)}
.step button:active{background:var(--accent-soft)}
.step output{min-width:46px;text-align:center;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;padding:0 2px}
.step output small{font-weight:600;color:var(--ink2);font-size:10px;display:block;margin-top:-2px}
.empty{text-align:center;color:var(--ink2);padding:48px 16px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-inline:max(0px,env(safe-area-inset-left,0px)) max(0px,env(safe-area-inset-right,0px))}
.tabs-in{display:flex;width:100%;max-width:560px}
.tab{flex:1;border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--ink2);position:relative}
.tab[aria-selected="true"]{color:var(--accent)}
.tab .cnt{position:absolute;top:4px;left:calc(50% + 8px);background:var(--out);color:#fff;font-size:10.5px;font-weight:800;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
:root[data-theme="dark"] .tab .cnt{color:#1a0b0e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab .cnt{color:#1a0b0e}}

/* order tab */
.ord-top{padding-block:14px 4px}
.ord-top h2{margin:0 0 2px;font-size:19px;font-weight:800}
.ord-top p{margin:0;color:var(--ink2);font-size:13px}
.line{display:grid;grid-template-columns:1fr auto;gap:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;align-items:center}
.line .nm{-webkit-line-clamp:2}
.line .sub{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.line .sub b{color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.line .rm{border:0;background:none;color:var(--ink2);font-size:12px;font-weight:700;text-decoration:underline;padding:4px}
.totalbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:24;display:flex;justify-content:center;padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px))}
.totalbar-in{width:100%;max-width:560px;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow)}
.totalbar-in .amt{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.totalbar-in .amt small{display:block;font-size:11.5px;font-weight:600;opacity:.75}
.tb-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:800;font-size:13px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid currentColor;color:inherit}
.btn.danger{background:var(--out);color:#fff}
.btn.block{width:100%;padding:12px;font-size:14px}
.btn:disabled{opacity:.5}
.subtot{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,25,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.sheet header{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:start}
.sheet .ph{width:88px;height:88px;font-size:26px;position:relative}
.ph-btn{padding:0;border:0;background:none;position:relative;border-radius:14px;width:88px;height:88px}
.ph-btn .cam{position:absolute;right:-4px;bottom:-4px;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;border:2px solid var(--surface)}
.fld{display:grid;gap:5px}
.fld label{font-size:12px;font-weight:700;color:var(--ink2)}
.fld input,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.fld textarea{resize:vertical;min-height:60px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hist{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.hist th{text-align:left;color:var(--ink2);font-size:11.5px;font-weight:700;padding:4px 0}
.hist td{padding:6px 0;border-top:1px solid var(--line)}
.hist td:not(:first-child),.hist th:not(:first-child){text-align:right}
.sheet h3{margin:0;font-size:13px;color:var(--ink2);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.x{position:absolute;right:12px;top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;z-index:60;max-width:90vw;box-shadow:var(--shadow)}
.banner{background:var(--low-soft);color:var(--low);font-size:12.5px;font-weight:600;padding:8px 16px;text-align:center}
@media (prefers-reduced-motion:no-preference){.card,.chip,.btn{transition:transform .08s ease}.card:active{transform:scale(.995)}}

var S={cat:'All',filter:'all',q:'',tab:'stock',catalog:null,docs:{},order:{add:{},qty:{},skip:{}},ordFilter:'all',db:null,assets:null,downloads:null,live:false,confirmRecv:false,confirmFill:false,view:'home'};

/* ---------- storage: shared db when available, otherwise this device ---------- */
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- item helpers ---------- */
function eff(it){
  var d=S.docs[it.id]||{};
  return {id:it.id,cat:it.cat,unit:it.unit,price:it.price,buys:it.buys,inv:it.inv,
    name:d.name||it.name, par:d.par!=null?d.par:it.par, low:d.low!=null?d.low:it.low,
    n:(typeof d.n==='number')?d.n:null, photo:d.photo||null, note:d.note||'', at:d.at||null};
}
function status(e){
  if(e.n===null) return 'new';
  if(e.n<=0) return 'out';
  if(e.low>0 && e.n<=e.low) return 'low';
  return 'ok';
}
var LABEL={out:'Out of stock',low:'Running low',ok:'In stock','new':'Not counted'};
function stepOf(e){return e.unit==='kg'?0.5:1}
function unitLb(e){return e.unit==='kg'?'kg':'pc'}
function suggest(e){var need=e.par-(e.n||0);var st=stepOf(e);need=Math.ceil(need/st)*st;return Math.max(st,need)}
function ago(iso){
  if(!iso) return '';
  var d=(Date.now()-new Date(iso).getTime())/864e5;
  if(d<0.04) return 'just now'; if(d<1) return 'today'; if(d<2) return 'yesterday';
  if(d<14) return Math.floor(d)+' days ago'; return Math.floor(d/7)+' weeks ago';
}
function initials(n){var w=n.replace(/[^A-Za-z0-9 ]/g,' ').trim().split(/\s+/);return ((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase()}
function hue(cat){return HUES[cat]!=null?HUES[cat]:260}
function photoHtml(e,cls){
  var h='style="--h:'+hue(e.cat)+'"';
  if(e.photo) return '<div class="ph" '+h+'><img src="'+esc(e.photo)+'" alt="" loading="lazy" onerror="this.remove()"></div>';
  return '<div class="ph" '+h+' aria-hidden="true">'+esc(initials(e.name))+'</div>';
}

/* ---------- saving ---------- */
function post(obj){
  return fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(obj)});
}
function itemMsg(id,d){
  var it=S.catalog.items.filter(function(x){return x.id===id})[0]||{};
  if(id.indexOf('c_')===0) return {type:'item',id:id,doc:d,name:id.slice(2),cat:'(category photo)',inv:''};
  return {type:'item',id:id,doc:d,name:d.name||it.name||'',cat:it.cat||'',inv:it.inv||''};
}
function persistItem(id){
  var d=S.docs[id]; lsSet('pantry-items',S.docs); delete timers[id];
  if(S.live||SYNC_ON){ post(itemMsg(id,d)).catch(function(){toast('Could not save. Check your connection.')}); }
}
function patchItem(id,patch,opts){
  var cur=S.docs[id]||{};
  var next={}; Object.keys(cur).forEach(function(k){next[k]=cur[k]});
  Object.keys(patch).forEach(function(k){next[k]=patch[k]});
  if(!opts||!opts.keepTime) next.at=new Date().toISOString();
  S.docs[id]=next;
  clearTimeout(timers[id]);
  timers[id]=setTimeout(function(){persistItem(id)},350);
}
function persistOrder(){
  lsSet('pantry-order',S.order); S.orderAt=Date.now();
  if(SYNC_ON){ post({type:'order',order:S.order}).catch(function(){toast('Could not save the order list.')}); }
}

/* ---------- derived lists ---------- */
function allItems(){return S.catalog.items.map(eff)}
function counts(list){
  var c={all:list.length,out:0,low:0,ok:0,'new':0};
  list.forEach(function(e){c[status(e)]++});
  return c;
}
function orderLines(){
  var lines=[];
  S.catalog.items.forEach(function(it){
    var e=eff(it), st=status(e);
    var added=S.order.add[e.id]!=null;
    var auto=(st==='out'||st==='low');
    if(!(auto||added)) return;
    if(S.order.skip[e.id] && !added) return;
    var q=S.order.qty[e.id]!=null?S.order.qty[e.id]:(added?S.order.add[e.id]:suggest(e));
    lines.push({e:e,st:st,qty:q,added:added&&!auto,total:q*e.price});
  });
  return lines;
}

function tileHtml(cat,st){
  var cp=(S.docs['c_'+cat]||{}).photo, ph=st.photos, inner, cls='cimg';
  if(cp) inner='<img src="'+esc(cp)+'" alt="" loading="lazy">';
  else if(ph.length>=2){ cls+=' col'; inner=ph.slice(0,4).map(function(u){return '<img src="'+esc(u)+'" alt="" loading="lazy">'}).join('') }
  else if(ph.length===1) inner='<img src="'+esc(ph[0])+'" alt="" loading="lazy">';
  else inner=esc(initials(cat));
  var b=st.need;
  return '<button class="ctile" data-cat="'+esc(cat)+'"><span class="'+cls+'" style="--h:'+hue(cat)+'">'+inner+(b?'<span class="bd">'+b+'</span>':'')+'</span><span class="clb">'+esc(cat)+'</span></button>';
}
function renderHome(){
  var list=allItems(), stats={};
  S.catalog.categories.forEach(function(c){stats[c]={need:0,photos:[]}});
  list.forEach(function(e){var st=stats[e.cat]; if(!st) return; var s=status(e); if(s==='out'||s==='low') st.need++; if(e.photo&&st.photos.length<4) st.photos.push(e.photo)});
  var needs=list.filter(function(e){var s=status(e);return s==='out'||s==='low'}).sort(function(a,b){return (status(a)==='out'?0:1)-(status(b)==='out'?0:1)});
  var html='<div class="gut home">';

    html+='<h2 class="gh">Needs buying · '+needs.length+'<small data-t="gotoorder" role="button" tabindex="0">Order list ›</small></h2><div class="strip">'+needs.slice(0,14).map(function(e){
      var s=status(e);
      return '<div class="mini" data-id="'+e.id+'" tabindex="0">'+photoHtml(e)+'<h3>'+esc(e.name)+'</h3><span class="pill s-'+s+'">'+(s==='low'?'Only '+num(e.n)+' left':'Out of stock')+'</span></div>'}).join('')+'</div>';
  } else {
    var unc=list.filter(function(e){return status(e)==='new'}).length;
    html+='<div class="empty" style="margin-top:14px"><b>'+(unc?unc+' items not counted yet':'Nothing needs buying')+'</b>'+(unc?'Open a category and set the stock. Items that run out will appear here.':'Everything is above its warning level.')+'</div>';
  }
  var used={};
  GROUPS.forEach(function(g){
    var cats=g[1].filter(function(c){return stats[c]}); if(!cats.length) return;
    cats.forEach(function(c){used[c]=1});
    html+='<h2 class="gh">'+esc(g[0])+'</h2><div class="cgrid">'+cats.map(function(c){return tileHtml(c,stats[c])}).join('')+'</div>';

  var rest=S.catalog.categories.filter(function(c){return !used[c]});
  if(rest.length) html+='<h2 class="gh">Other</h2><div class="cgrid">'+rest.map(function(c){return tileHtml(c,stats[c])}).join('')+'</div>';
  html+='</div>';

/* ---------- render: stock tab ---------- */
function cardHtml(e){
  var st=status(e), st1=stepOf(e);
  var meta=inr(e.price)+' / '+unitLb(e)+' · usual '+num(e.par)+(e.at?' · '+ago(e.at):'');
  var label=st==='low'?('Only '+num(e.n)+' left'):LABEL[st];
  return '<article class="card" data-id="'+e.id+'" tabindex="0" aria-label="'+esc(e.name)+', '+esc(label)+'">'+
    photoHtml(e)+
    '<div class="cb"><h3 class="nm">'+esc(e.name)+'</h3><p class="mt">'+esc(meta)+'</p>'+
    '<div class="cr"><span class="pill s-'+st+'">'+esc(label)+'</span>'+
    '<span class="step"><button data-act="dec" aria-label="Reduce '+esc(e.name)+' by '+st1+'">−</button><output>'+(e.n===null?'–':num(e.n))+'<small>'+unitLb(e)+'</small></output><button data-act="inc" aria-label="Add '+st1+' to '+esc(e.name)+'">+</button></span></div></div></article>';

    if(S.filter!=='all' && status(e)!==S.filter) return false;
    if(q && (e.name+' '+e.inv).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  var chips=[['all','All',c.all,''],['out','Out of stock',c.out,'c-out'],['low','Running low',c.low,'c-low'],['ok','In stock',c.ok,'c-ok'],['new','Not counted',c['new'],'']];

  var unc=base.filter(function(e){return status(e)==='new'}).length;
  html+='<div class="tools">'+(unc?'<button class="btn ghost'+(S.confirmFill?' sure':'')+'" data-t="fill">'+(S.confirmFill?'Tap again: set '+unc+' to usual stock':'Set '+unc+' uncounted to usual stock')+'</button>':'')+(S.downloads?'<button class="btn ghost" data-t="backup">Download stock sheet</button>':'')+'</div>';
  if(!shown.length){
    html+='<div class="empty"><b>Nothing here</b>'+(S.filter!=='all'?'No items match this filter in '+esc(S.cat==='All'?'any category':S.cat)+'.':'Try another search.')+'</div></div>';

  });
  html+='</div>';
  $('#main').innerHTML=html;
}

function orderText(){

  var d=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  var out=['Metro order list · '+d,''];
  S.catalog.categories.forEach(function(c){
    if(!by[c]) return; out.push(c.toUpperCase());

function shrink(file,max){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var r=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      var q=0.72,u=c.toDataURL('image/jpeg',q); while(u.length>38000&&q>0.3){q-=0.1;u=c.toDataURL('image/jpeg',q)} res(u);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej({code:'invalid_request'})};
    img.src=url;
  });
}

    if(d.order && !(S.orderAt&&Date.now()-S.orderAt<8000) && !sameJson(S.order,d.order)){S.order={add:d.order.add||{},qty:d.order.qty||{},skip:d.order.skip||{}};changed=true}
    setSync(true);
